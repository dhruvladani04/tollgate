[project]
name = "tollgate"
version = "0.1.0"
description = "MCP proxy that gates tool calls and scans tool results with TypeSafe's Jev model"
readme = "README.md"
authors = [
    { name = "Dhruv Ladani", email = "dhruvladanicode04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
tollgate = "tollgate.proxy.server:main"
tollgate-approve = "tollgate.approve.cli:main"
tollgate-hook = "tollgate.prompts:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files are tables of test data; their long strings are kept on one line.
"evals/scenes/*.py" = ["E501"]
"evals/injecagent.py" = ["E501"]
