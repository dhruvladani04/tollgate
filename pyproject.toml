[project]
name = "tollgate-mcp"
version = "0.1.0"
description = "MCP proxy that gates tool calls and scans tool results with TypeSafe's Jev model"
readme = "README.md"
authors = [
    { name = "Dhruv Ladani", email = "dhruvladanicode04@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "guardrails", "tool-calls", "prompt-injection", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx2>=2.0.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "system-one-adapter[gemini]>=0.2.1",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/dhruvladani04/tollgate"
Issues = "https://github.com/dhruvladani04/tollgate/issues"
Results = "https://github.com/dhruvladani04/tollgate/blob/main/docs/results.md"

[project.scripts]
tollgate = "tollgate.proxy.server:main"
tollgate-approve = "tollgate.approve.cli:main"
tollgate-hook = "tollgate.prompts:main"
tollgate-dashboard = "tollgate.dashboard.app:main"
tollgate-init = "tollgate.init:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "langchain-google-genai>=4.4.1",
    "langgraph>=1.2.14",
]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files are tables of test data; their long strings are kept on one line.
"evals/scenes/*.py" = ["E501"]
"evals/injecagent.py" = ["E501"]

[tool.uv.build-backend]
# The package installs as `tollgate-mcp`, because `tollgate` is taken on PyPI, and
# is still imported as `tollgate`.
module-name = "tollgate"
